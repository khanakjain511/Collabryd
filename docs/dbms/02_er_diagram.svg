<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#f8fafc"/>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
  .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 14px; font-weight: 400; fill: #64748b; }
  .entity { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
  .entity-head { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
  .entity-name { font-size: 15px; font-weight: 700; fill: #1d4ed8; }
  .attr-pk { font-size: 11px; font-weight: 700; fill: #b91c1c; }
  .attr-fk { font-size: 11px; font-weight: 600; fill: #4338ca; }
  .attr-uq { font-size: 11px; font-weight: 600; fill: #047857; }
  .attr-normal { font-size: 11px; fill: #334155; }
  .rel-line { stroke: #64748b; stroke-width: 1.5; fill: none; }
  .card-label { font-size: 11px; font-weight: 600; fill: #475569; background: #ffffff; }
  .divider { stroke: #cbd5e1; stroke-width: 1; }
</style>

<!-- Header -->
<text x="50" y="45" class="title">Collabryd — Entity Relationship Diagram (ERD)</text>
<text x="50" y="68" class="subtitle">Relational schema architecture modeling users, profiles, catalogues, projects, applications, team rosters, realtime chat, and notifications.</text>

<!-- Column 1: Users, Profile, Preferences, Achievements, Links (x: 50) -->
<!-- USERS -->
<g transform="translate(50, 100)">
  <rect width="220" height="145" class="entity"/>
  <rect width="220" height="32" rx="8" class="entity-head"/>
  <rect y="24" width="220" height="8" fill="#eff6ff"/>
