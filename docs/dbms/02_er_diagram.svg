  <text x="14" y="52" class="attr-pk">PK  user_id (BIGINT)</text>
  <text x="14" y="70" class="attr-uq">UQ  email (VARCHAR)</text>
  <text x="14" y="88" class="attr-normal">password_hash (VARCHAR)</text>
  <text x="14" y="106" class="attr-normal">account_status (VARCHAR)</text>
  <text x="14" y="124" class="attr-normal">created_at, updated_at</text>
</g>

