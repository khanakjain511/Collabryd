<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/instrument-serif-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/images/campus-team.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <meta name="theme-color" content="#fffbf2" />
    <meta
      name="description"
      content="Find your people. Form your team. Collabryd is a campus-first teammate and hackathon discovery platform."
    />
    <script>
      try {
        const theme = localStorage.getItem("collabyrd-theme");
        const isDark =
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        const activeTheme = isDark ? "dark" : "light";
        document.documentElement.dataset.theme = activeTheme;
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute("content", isDark ? "#0c2420" : "#fffbf2");

        const motion = localStorage.getItem("collabyrd-motion");
        const sysReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const isReduced =
          motion === "reduced" || motion === "off" || (!motion && sysReduced);
        document.documentElement.dataset.motion = isReduced ? "reduced" : "full";
      } catch {}
    </script>
    <title>Collabyrd · Every team starts with an open seat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
